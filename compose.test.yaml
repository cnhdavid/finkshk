services:
  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/fink-web:test
    restart: unless-stopped
    networks:
      internal:
      proxy:
        aliases:
          - fink-test-web

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/fink-api:test
    restart: unless-stopped
    networks:
      internal:
      proxy:
        aliases:
          - fink-test-api

  db:
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - internal

networks:
  proxy:
    external: true
